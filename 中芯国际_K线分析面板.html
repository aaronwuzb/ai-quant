(function() {
    var chart = echarts.init(document.getElementById('kline-chart'));
    var upColor = '#e83939';
    var downColor = '#2ba350';

    chart.setOption({
        tooltip: {
            trigger: 'axis',
            axisPointer: { type: 'cross' },
            formatter: function(params) {
                var d = params[0];
                if (!d) return '';
                var raw = DATA.raw[d.dataIndex];
                var change = raw.close - raw.open;
                var pct = (change / raw.open * 100).toFixed(2);
                var color = change >= 0 ? upColor : downColor;
                var sgn = change >= 0 ? '+' : '';
                return '<div style="font-size:13px">' +
                    '<b>' + raw.date + '</b><br/>' +
                    '开盘: <b>' + raw.open.toFixed(2) + '</b><br/>' +
                    '收盘: <b style="color:' + color + '">' + raw.close.toFixed(2) + '</b><br/>' +
                    '最高: ' + raw.high.toFixed(2) + ' &nbsp; 最低: ' + raw.low.toFixed(2) + '<br/>' +
                    '涨跌: <b style="color:' + color + '">' + sgn + change.toFixed(2) + ' (' + sgn + pct + '%)</b><br/>' +
                    '成交量: ' + (raw.volume / 10000).toFixed(0) + '万手<br/>' +
                    '成交额: ' + (raw.amount / 100000000).toFixed(2) + '亿' +
                    '</div>';
            }
        },
        grid: { left: '8%', right: '2%', top: '5%', height: '75%' },
        xAxis: {
            type: 'category',
            data: DATA.dates,
            axisLine: { lineStyle: { color: '#999' } },
            axisLabel: { rotate: 45, formatter: function(v) { return v.substring(5); } },
            splitLine: { show: false }
        },
        yAxis: {
            type: 'value',
            scale: true,
            splitArea: { show: true },
            axisLabel: { formatter: '¥{value}' }
        },
        series: [{
            name: 'K线',
            type: 'candlestick',
            data: DATA.kline,
            itemStyle: {
                color: upColor,
                color0: downColor,
                borderColor: upColor,
                borderColor0: downColor
            },
            markPoint: {
                label: { formatter: function(p) { return p.value.toFixed(1); } },
                data: [
                    { type: 'max', name: '最高价', symbol: 'pin', symbolSize: 40 },
                    { type: 'min', name: '最低价', symbol: 'pin', symbolSize: 40 }
                ]
            }
        }]
    });

    window.addEventListener('resize', function() { chart.resize(); });
})();

(function() {
    var chart = echarts.init(document.getElementById('volume-chart'));
    var upColor = '#e83939';
    var downColor = '#2ba350';

    var volData = DATA.volume.map(function(v) {
        return {
            value: v[1],
            itemStyle: { color: v[2] >= 0 ? upColor : downColor }
        };
    });

    chart.setOption({
        tooltip: {
            trigger: 'axis',
            formatter: function(params) {
                var d = params[0];
                if (!d) return '';
                var raw = DATA.raw[d.dataIndex];
                return '<b>' + raw.date + '</b><br/>成交量: <b>' + (raw.volume / 10000).toFixed(0) + '万手</b><br/>成交额: ' + (raw.amount / 100000000).toFixed(2) + '亿';
            }
        },
        grid: { left: '8%', right: '2%', top: '10%', bottom: '5%' },
        xAxis: {
            type: 'category',
            data: DATA.dates,
            axisLabel: { show: false },
            axisTick: { show: false },
            splitLine: { show: false }
        },
        yAxis: {
            type: 'value',
            scale: true,
            splitLine: { show: true, lineStyle: { color: '#f0f0f0' } },
            axisLabel: { formatter: function(v) { return (v / 10000).toFixed(0) + '万'; } }
        },
        series: [{ type: 'bar', data: volData }]
    });

    window.addEventListener('resize', function() { chart.resize(); });
})();

(function() {
    var rows = '';
    var rawData = DATA.raw.slice().reverse();
    for (var i = 0; i < rawData.length; i++) {
        var d = rawData[i];
        var cls = d.close >= d.open ? 'up' : 'down';
        rows += '<tr>' +
            '<td>' + d.date + '</td>' +
            '<td>' + d.open.toFixed(2) + '</td>' +
            '<td class="' + cls + '">' + d.close.toFixed(2) + '</td>' +
            '<td>' + d.high.toFixed(2) + '</td>' +
            '<td>' + d.low.toFixed(2) + '</td>' +
            '<td>' + (d.volume / 10000).toFixed(0) + '万</td>' +
            '<td>' + (d.amount / 100000000).toFixed(2) + '</td>' +
            '</tr>';
    }
    document.getElementById('table-body').innerHTML = rows;
})();
</script>
