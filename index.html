<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中芯国际 K线分析</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
}
.container { max-width: 720px; width: 100%; }
.header {
    text-align: center;
    margin-bottom: 40px;
    color: #fff;
}
.header h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
.header p { font-size: 14px; opacity: 0.65; }
.cards { display: flex; flex-direction: column; gap: 20px; }
.card {
    display: flex;
    align-items: center;
    gap: 20px;
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 24px 28px;
    text-decoration: none;
    color: #fff;
    transition: all 0.3s ease;
}
.card:hover {
    background: rgba(255,255,255,0.12);
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}
.card-icon {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: 700;
    flex-shrink: 0;
}
.card-icon.a { background: linear-gradient(135deg, #e83939, #ff6b6b); }
.card-icon.hk { background: linear-gradient(135deg, #2ba350, #4cd964); }
.card-info { flex: 1; }
.card-info .name { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
.card-info .code { font-size: 13px; opacity: 0.5; margin-bottom: 6px; }
.card-info .stats { font-size: 13px; opacity: 0.75; }
.card-info .stats span { margin-right: 12px; }
.arrow { font-size: 20px; opacity: 0.4; }
.footer {
    text-align: center;
    margin-top: 40px;
    color: rgba(255,255,255,0.35);
    font-size: 12px;
}
.footer a { color: rgba(255,255,255,0.5); }
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>中芯国际 K线分析</h1>
        <p>近一年日线走势 · 交互式K线图 + 成交量面板 · 数据截至 2026-07-02</p>
    </div>
    <div class="cards">
        <a href="中芯国际_K线分析面板.html" class="card">
            <div class="card-icon a">A</div>
            <div class="card-info">
                <div class="name">中芯国际</div>
                <div class="code">688981.SH · 科创板</div>
                <div class="stats">
                    <span>最新 ¥144.10</span>
                    <span style="color:#e83939">+67.36%</span>
                </div>
            </div>
            <div class="arrow">→</div>
        </a>
        <a href="中芯国际_hk00981_K线分析面板.html" class="card">
            <div class="card-icon hk">港</div>
            <div class="card-info">
                <div class="name">中芯国际</div>
                <div class="code">00981.HK · 中国香港</div>
                <div class="stats">
                    <span>最新 HK$80.40</span>
                    <span style="color:#e83939">+84.62%</span>
                </div>
            </div>
            <div class="arrow">→</div>
        </a>
    </div>
    <div class="footer">
        Data by 腾讯自选股 · Powered by ECharts · <a href="https://github.com/aaronwuzb/ai-quant">GitHub</a>
    </div>
</div>
</body>
</html>
